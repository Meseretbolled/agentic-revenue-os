# Autonomy per action. Every action key must be listed: an allowlist the pack owns. SAMPLE caps and windows.
autonomy_levels:
  enrich: auto
  score: auto
  crm_update: auto
  crm_note: auto
  first_touch.A: auto_with_veto     # top tier: sent after the veto window
  first_touch.B: auto
  first_touch.C: auto
  follow_up: auto
  reminder: auto
  classify_reply: auto
  snooze_ooo: auto
  suppress_contact: auto
  cancel_scheduled_sends: auto
  attach_case_study: auto           # library items only (the policy checks this)
  generate_io: auto
  send_io: auto                     # only after the IO validator passes (policy hard block)
  social_message: needs_approval    # draft-only in code; a person sends it
  linkedin_draft: auto              # a draft for a person to copy and send; nothing here can send it
  lesson_write: auto
  book_meeting: auto
  handoff: auto
  price_message: auto_with_veto

max_discount_pct: 15                # SAMPLE; above this the IO is blocked, with no override
daily_cap: 50
domain_cap: 3
veto_window_seconds: 60
send_window: {start_hour: 9, end_hour: 17, days: [0, 1, 2, 3, 4]}
default_timezone: UTC

# The IO's limits: the same validation rules as the other segment. SAMPLE numbers for the demo.
io_budget_min_usd: 5000
io_budget_max_usd: 2000000
io_max_term_months: 24
io_payment_terms: "Net 30 (SAMPLE terms, to be replaced by the real agreement)"
io_min_lead_days: 14
io_default_term_months: 3
