# SAMPLE rate card. COOL publishes no rate card; every price here is invented for the demo and
# must never be presented as COOL's pricing.
label: "SAMPLE rate card: illustrative numbers for the demo, not COOL's pricing"
currency: USD
items:
  - {id: creative_automation, name: "DCO and Creative Automation", unit: "per month", price: 2500}
  - {id: multi_location, name: "Franchise and Multi-location", unit: "per location per month", price: 40}
  - {id: media_fee, name: "Media activation management fee", unit: "percent of media spend", price: 12}
  - {id: measurement, name: "Measurement and Attribution", unit: "per month", price: 1500}

# SAMPLE packages (invented for the demo). The IO planner picks the largest package whose minimum monthly
# budget the lead's stated budget reaches. Quantities are per month; a line's quantity may follow a lead
# field (location_count). No volume discount by default: add {min_monthly_budget_usd, discount_pct} rows.
packages:
  - id: starter
    name: "Starter (SAMPLE)"
    min_monthly_budget_usd: 5000
    lines:
      - {id: creative_automation, quantity: 1}
      - {id: measurement, quantity: 1}
  - id: growth
    name: "Growth (SAMPLE)"
    min_monthly_budget_usd: 15000
    lines:
      - {id: creative_automation, quantity: 1}
      - {id: multi_location, quantity_from: location_count, quantity_max: 60}
      - {id: measurement, quantity: 1}
  - id: scale
    name: "Scale (SAMPLE)"
    min_monthly_budget_usd: 35000
    lines:
      - {id: creative_automation, quantity: 2}
      - {id: multi_location, quantity_from: location_count, quantity_max: 200}
      - {id: measurement, quantity: 1}
volume_discounts: []
