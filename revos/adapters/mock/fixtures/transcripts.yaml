  - id: call-001
    title: "Discovery call: Brightside Optical Group"
    participants: [Jo Rivers, Sam Lee]
    ended_at: "2026-10-14T15:30:00+00:00"
    text: |
      Jo Rivers: Thanks for making time, Sam. What are you hoping to solve?
      Sam Lee: We need local campaigns for all our practices without every owner redoing the creative.
      Jo Rivers: What does your budget look like?
      Sam Lee: Our budget is about fifty thousand dollars for the first quarter.
      Jo Rivers: And timing?
      Sam Lee: The timeline is to launch by Q1, ideally within eight weeks.
      Jo Rivers: Who signs off on this?
      Sam Lee: Dana Park, our CMO, is the decision maker. I will make the case to her.
      Sam Lee: One concern is that our owners worry about brand compliance on local ads.
