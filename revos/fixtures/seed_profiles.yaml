# Fictional seed leads for `revos seed <tag> --profile hot|warm|cold`, keyed by segment pack id.
#
# HONESTY NOTE: every company, person and number here is invented for the demo. The fields are
# SYNTHETIC CRM SIGNALS (website visits, a pricing-page view, a demo request) standing in for what a
# real portal would hold. They are never presented as COOL's data. Engagement signals that need a
# real event (a reply, a booked meeting) are deliberately NOT faked: the only engagement signal a
# lead can honestly carry before any outreach is a case-study click.
#
# `timezone` is the contact's IANA time zone (slots are shown in it). `research_notes` are invented
# facts about the fictional company; each `source` must say it is a fictional demo profile, and the
# emails label them so. They are never real research, and real research found later takes priority.
#
# `signer_email_tag` makes the signer's address a plus-address of PROSPECT_TEST_EMAIL (fictional). The
# signer's email always comes from the lead record like this, never from what is said on a call.
#
# Expected tiers come from the pack's own weights (fit 0.5, intent 0.3, engagement 0.2; A >= 65,
# B >= 40, C >= 20); tests/unit/test_seed_profiles.py enforces them.
franchise_brands:
  hot:
    company: Harborview Optical Collective
    domain: harborview-optical.example
    contact: Maya Ortiz
    expect_tier: A
    signer_email_tag: signer-harborview
    signer_name: Marcus Reyes            # the lead record's signer (fictional); a call can only add a name
    signer_role: VP of Marketing
    signer_note: fictional demo signer (invented for this demo)
    timezone: America/Chicago
    research_notes:
      - text: "Harborview Optical Collective runs 85 locations across Texas and Oklahoma."
        source: "fictional demo profile (invented for this demo, not real research)"
      - text: "Harborview Optical Collective is hiring a Regional Marketing Manager."
        source: "fictional demo profile (invented for this demo, not real research)"
    fields:
      location_count: 85
      is_franchise: true
      industry: optical
      region: US
      annual_ad_spend_usd: 400000
      contact_seniority: vp
      requested_demo: true
      visited_pricing_page: true
      website_visits_30d: 6
      hiring_marketing_roles: true
      local_marketing_pain_mentioned: true
      clicked_case_study: true
  warm:
    company: Millbrook Inns
    domain: millbrook-inns.example
    contact: Lee Chen
    expect_tier: B
    signer_email_tag: signer-millbrook
    signer_note: fictional demo signer (invented for this demo)
    timezone: America/Toronto
    research_notes:
      - text: "Millbrook Inns runs 22 inns across Ontario and Quebec."
        source: "fictional demo profile (invented for this demo, not real research)"
      - text: "Millbrook Inns is planning a regional campaign for the spring season."
        source: "fictional demo profile (invented for this demo, not real research)"
    fields:
      location_count: 22
      is_franchise: true
      industry: hospitality
      region: CA
      annual_ad_spend_usd: 300000
      contact_seniority: manager
      visited_pricing_page: true
      website_visits_30d: 4
  cold:
    company: Ridgeline Auto Parts
    domain: ridgeline-parts.example
    contact: Pat Kim
    expect_tier: C
    signer_email_tag: signer-ridgeline
    signer_note: fictional demo signer (invented for this demo)
    timezone: America/Mexico_City
    research_notes:
      - text: "Ridgeline Auto Parts runs 12 stores across Mexico."
        source: "fictional demo profile (invented for this demo, not real research)"
      - text: "Ridgeline Auto Parts sells replacement parts to independent garages."
        source: "fictional demo profile (invented for this demo, not real research)"
    fields:
      location_count: 12
      is_franchise: false
      industry: automotive
      region: MX
      contact_seniority: other
      hiring_marketing_roles: true
      website_visits_30d: 3
